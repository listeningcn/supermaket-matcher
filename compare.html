<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supermarket Price Matcher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h3 style="margin-top:0;">🛒 Supermarket Price Matcher</h3>
    
    <div class="search-container">
        <!-- Input now triggers search on 'Enter' key press -->
        <input type="text" id="searchInput" placeholder="Search product (e.g. Butter)" autofocus>
        <button id="searchButton">Compare</button>
    </div>

    <div id="loading">Fetching live supermarket data...</div>
    <div id="results"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
